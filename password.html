<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal Pay - Change Password</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f7f8fc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: #f9fafc;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* Top Header */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            background: #fff;
            border-bottom: 1px solid #f0f2f5;
        }

        .header-title {
            font-size: 17px;
            font-weight: 800;
            color: #222;
        }

        .back-btn {
            color: #333;
            font-size: 16px;
            text-decoration: none;
        }

        /* Content Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 25px 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin-bottom: 8px;
            display: block;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box input {
            width: 100%;
            padding: 14px 45px 14px 15px;
            font-size: 14px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            outline: none;
            transition: 0.2s;
        }

        .input-box input:focus {
            border-color: #16a34a;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        .toggle-eye {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 16px;
        }

        .save-btn {
            width: 100%;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            border: none;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.2);
            margin-top: 10px;
            transition: 0.2s;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: #fff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 15px 0;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #8e8e93;
            font-size: 10px;
            font-weight: 600;
        }

        .nav-item i {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: #16a34a;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="profile-header">
            <a href="mine.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
            <div class="header-title">Change Password</div>
            <div style="width: 16px;"></div>
        </div>

        <div class="content-area">
            <div class="form-group">
                <label class="form-label">पुरानो पासवर्ड (Old Password)</label>
                <div class="input-box">
                    <input type="password" id="oldPassword" placeholder="पुरानो पासवर्ड राख्नुहोस्">
                    <button type="button" class="toggle-eye" onclick="togglePassword('oldPassword', 'eye1')">
                        <i class="fa-solid fa-eye" id="eye1"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">नयाँ पासवर्ड (New Password)</label>
                <div class="input-box">
                    <input type="password" id="newPassword" placeholder="नयाँ पासवर्ड राख्नुहोस्">
                    <button type="button" class="toggle-eye" onclick="togglePassword('newPassword', 'eye2')">
                        <i class="fa-solid fa-eye" id="eye2"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">नयाँ पासवर्ड कन्फर्म गर्नुहोस्</label>
                <div class="input-box">
                    <input type="password" id="confirmPassword" placeholder="फेरि नयाँ पासवर्ड लेख्नुहोस्">
                    <button type="button" class="toggle-eye" onclick="togglePassword('confirmPassword', 'eye3')">
                        <i class="fa-solid fa-eye" id="eye3"></i>
                    </button>
                </div>
            </div>

            <button type="button" class="save-btn" onclick="updatePassword()">पासवर्ड सुरक्षित गर्नुहोस्</button>
        </div>

        <div class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="mining.html" class="nav-item"><i class="fa-solid fa-asterisk"></i><span>Mining</span></a>
            <a href="team.html" class="nav-item"><i class="fa-solid fa-users-viewfinder"></i><span>Team</span></a>
            <a href="mine.html" class="nav-item active"><i class="fa-solid fa-robot"></i><span>Mine</span></a>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxhx6PSbcK6lClXQnsN-mcmQXEwRZgKJ4",
            authDomain: "earning-site-88f92.firebaseapp.com",
            projectId: "earning-site-88f92",
            storageBucket: "earning-site-88f92.firebasestorage.app",
            messagingSenderId: "17257443529",
            appId: "1:17257443529:web:496d88aafdc853a88a1d18"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUserId = localStorage.getItem('userId');

        // यदि localStorage मा छैन भने Firebase Auth बाट स्वतः लिने
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                localStorage.setItem('userId', currentUserId); // पछि सजिलोको लागि सेभ गर्ने
            }
        });

        // पासवर्ड देखाउने वा लुकाउने फंक्शन
        window.togglePassword = function(fieldId, iconId) {
            const inputField = document.getElementById(fieldId);
            const eyeIcon = document.getElementById(iconId);
            
            if (inputField.type === "password") {
                inputField.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                inputField.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }

        // पासवर्ड अपडेट गर्ने मुख्य फंक्शन
        window.updatePassword = async function() {
            const oldPass = document.getElementById('oldPassword').value.trim();
            const newPass = document.getElementById('newPassword').value.trim();
            const confirmPass = document.getElementById('confirmPassword').value.trim();

            // फेरि एकपटक Check गर्ने
            if (!currentUserId) {
                currentUserId = localStorage.getItem('userId');
            }

            if (!currentUserId) {
                alert('कृपया पहिलो लगइन गर्नुहोस्!');
                window.location.href = 'login.html';
                return;
            }

            if (!oldPass || !newPass || !confirmPass) {
                alert('कृपया सबै खाली ठाउँहरू भर्नुहोस्!');
                return;
            }

            if (newPass !== confirmPass) {
                alert('नयाँ पासवर्ड र कन्फर्म पासवर्ड मिलेन!');
                return;
            }

            if (newPass.length < 6) {
                alert('नयाँ पासवर्ड कम्तिमा ६ अक्षरको हुनुपर्छ!');
                return;
            }

            const userRef = ref(db, `users/${currentUserId}`);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                const userData = snapshot.val();
                const currentPassword = userData.password || "";

                if (currentPassword !== oldPass) {
                    alert('तपाईंले लेख्नुभएको पुरानो पासवर्ड मिलेन!');
                    return;
                }

                await update(userRef, { password: newPass });
                alert('पासवर्ड सफलतापूर्वक परिवर्तन भयो!');
                
                document.getElementById('oldPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } else {
                alert('युजरको डाटा फेला परेन!');
            }
        }
    </script>
</body>
</html>
