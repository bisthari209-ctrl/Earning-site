<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepal Pay - Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f7f8fc;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .phone-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            background-color: #f9fafc;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow-y: auto;
            padding: 20px;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            padding: 30px 24px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #f0f2f5;
            text-align: center;
        }

        .app-brand {
            font-size: 24px;
            font-weight: 900;
            color: #111;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-brand i {
            color: #16a34a;
        }

        .auth-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .auth-tabs {
            display: flex;
            background: #f1f3f5;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 25px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            color: #666;
            cursor: pointer;
            border-radius: 10px;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: #ffffff;
            color: #16a34a;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 700;
            color: #444;
            margin-bottom: 6px;
            display: block;
        }

        .input-with-icon {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-with-icon i {
            position: absolute;
            left: 14px;
            color: #888;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            font-size: 13px;
            outline: none;
            background: #fcfdfe;
            transition: 0.2s;
        }

        .form-input:focus {
            border-color: #16a34a;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.1);
        }

        .auth-submit-btn {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(22, 163, 74, 0.25);
            margin-top: 10px;
            transition: 0.2s;
        }

        .auth-submit-btn:active {
            transform: scale(0.98);
        }

        .form-container {
            display: none;
        }

        .form-container.active {
            display: block;
        }

        .switch-text {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
            font-weight: 500;
        }

        .switch-text span {
            color: #16a34a;
            font-weight: 700;
            cursor: pointer;
        }

        .custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: 0.25s ease;
        }

        .custom-alert-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .custom-alert-box {
            background: #ffffff;
            width: 85%;
            max-width: 320px;
            padding: 24px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transform: scale(0.8);
            transition: transform 0.25s ease;
        }

        .custom-alert-overlay.active .custom-alert-box {
            transform: scale(1);
        }

        .custom-alert-icon {
            font-size: 38px;
            color: #16a34a;
            margin-bottom: 12px;
        }

        .custom-alert-title {
            font-size: 16px;
            font-weight: 800;
            color: #111;
            margin-bottom: 8px;
        }

        .custom-alert-msg {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .custom-alert-btn {
            background: #16a34a;
            color: white;
            border: none;
            width: 100%;
            padding: 11px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="auth-card">
            
            <div class="app-brand">
                <i class="fa-solid fa-shield-halved"></i> Nepal Pay
            </div>
            <div class="auth-subtitle" id="authSubtitle">Welcome Back</div>

            <div class="auth-tabs">
                <button class="tab-btn active" id="loginTabBtn" onclick="switchForm('login')">Login</button>
                <button class="tab-btn" id="registerTabBtn" onclick="switchForm('register')">Register</button>
            </div>

            <!-- Login Form -->
            <div class="form-container active" id="loginForm">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-user"></i>
                        <input type="email" id="loginEmail" class="form-input" placeholder="Enter email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="loginPassword" class="form-input" placeholder="••••••••">
                    </div>
                </div>

                <button class="auth-submit-btn" onclick="handleLogin()">Login</button>
                
                <div class="switch-text">
                    Don't have an account? <span onclick="switchForm('register')">Sign up</span>
                </div>
            </div>

            <!-- Register Form -->
            <div class="form-container" id="registerForm">
                <div class="form-group">
                    <label class="form-label">Full Name</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" id="registerName" class="form-input" placeholder="John Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="registerEmail" class="form-input" placeholder="email@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-with-icon">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="registerPassword" class="form-input" placeholder="••••••••">
                    </div>
                </div>

                <button class="auth-submit-btn" onclick="handleRegister()">Sign Up</button>
                
                <div class="switch-text">
                    Already have an account? <span onclick="switchForm('login')">Login</span>
                </div>
            </div>

        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="custom-alert-overlay" id="customAlert">
        <div class="custom-alert-box">
            <div class="custom-alert-icon"><i class="fa-solid fa-circle-check" id="alertIconSymbol"></i></div>
            <div class="custom-alert-title" id="alertTitle">Success</div>
            <div class="custom-alert-msg" id="alertMsg">Message here</div>
            <button class="custom-alert-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <!-- Firebase SDK Scripts (Modular CDN Version) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBxhx6PSbcK6lClXQnsN-mcmQXEwRZgKJ4",
            authDomain: "earning-site-88f92.firebaseapp.com",
            projectId: "earning-site-88f92",
            storageBucket: "earning-site-88f92.firebasestorage.app",
            messagingSenderId: "17257443529",
            appId: "1:17257443529:web:496d88aafdc853a88a1d18"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.handleRegister = async function() {
            const name = document.getElementById('registerName').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            const password = document.getElementById('registerPassword').value;

            if (!name || !email || !password) {
                showCustomAlert('त्रुटि!', 'कृपया सबै विवरणहरू भर्नुहोस्।', true);
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                
                // Successful registration message, then redirect to index.html
                showCustomAlert('बधाई छ!', 'Registration Successful!');
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500); // 1.5 सेकेन्ड पछि स्वतः index.html मा जानेछ
            } catch (error) {
                showCustomAlert('त्रुटि!', error.message, true);
            }
        };

        window.handleLogin = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showCustomAlert('त्रुटि!', 'कृपया इमेल र पासवर्ड लेख्नुहोस्।', true);
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                
                // Successful login message, then redirect to index.html
                showCustomAlert('सफलतापूर्वक!', 'Login Successful!');
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 1500); // 1.5 सेकेन्ड पछि स्वतः index.html मा जानेछ
            } catch (error) {
                showCustomAlert('त्रुटि!', 'गलत इमेल वा पासवर्ड। कृपया फेरि प्रयास गर्नुहोस्।', true);
            }
        };
    </script>

    <script>
        function switchForm(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');
            const authSubtitle = document.getElementById('authSubtitle');

            if (type === 'login') {
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
                loginTabBtn.classList.add('active');
                registerTabBtn.classList.remove('active');
                authSubtitle.innerText = "Welcome Back";
            } else {
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
                registerTabBtn.classList.add('active');
                loginTabBtn.classList.remove('active');
                authSubtitle.innerText = "Create New Account";
            }
        }

        function showCustomAlert(title, message, isError = false) {
            document.getElementById('alertTitle').innerText = title;
            document.getElementById('alertMsg').innerText = message;
            
            const iconSymbol = document.getElementById('alertIconSymbol');
            if (isError) {
                iconSymbol.className = "fa-solid fa-circle-exclamation";
                iconSymbol.style.color = "#dc2626";
            } else {
                iconSymbol.className = "fa-solid fa-circle-check";
                iconSymbol.style.color = "#16a34a";
            }

            document.getElementById('customAlert').classList.add('active');
        }

        function closeCustomAlert() {
            document.getElementById('customAlert').classList.remove('active');
        }
    </script>
</body>
</html>
